<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acción Social - Municipalidad de Presidente Franco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-2xl font-bold">Municipalidad de Presidente Franco</h1>
        <p class="text-emerald-100 text-sm mt-1">Secretaría de Acción Social - Sistema de Gestión y Seguimiento</p>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-6 grid gap-6">
        
        <!-- Sección de Consulta Ciudadana -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold text-emerald-800 mb-2">🔍 Consulta el Estado de tu Ayuda</h2>
            <p class="text-sm text-slate-600 mb-4">Ingresa tu número de Cédula de Identidad (sin puntos) para verificar tu solicitud.</p>
            
            <div class="flex gap-2">
                <input type="text" id="busquedaCi" placeholder="Ej: 1234567" class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="consultarEstado()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-lg transition">Consultar</button>
            </div>

            <div id="resultadoConsulta" class="mt-4 hidden p-4 rounded-lg bg-slate-50 border border-slate-200"></div>
        </section>

        <!-- Sección de Administración (Funcionarios) -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-4">📋 Panel de Registro (Uso Interno)</h2>
            <form id="formSolicitud" onsubmit="registrarSolicitud(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Cédula de Identidad (CI)</label>
                    <input type="text" id="regCi" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre y Apellido</label>
                    <input type="text" id="regNombre" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Barrio / Zona</label>
                    <input type="text" id="regBarrio" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo de Ayuda Solicitada</label>
                    <select id="regAyuda" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <option value="Kit de Víveres">Kit de Víveres</option>
                        <option value="Ayuda Médica / Medicamentos">Ayuda Médica / Medicamentos</option>
                        <option value="Materiales de Construcción (Chapas)">Materiales de Construcción (Chapas)</option>
                        <option value="Asistencia Social General">Asistencia Social General</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg transition">Registrar Nueva Solicitud</button>
                </div>
            </form>
        </section>

    </main>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Reemplaza con tus datos)
        const SUPABASE_URL = 'https://htfdhovihrhrofsyosyr.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_3VNUdqUW0GLXtXCfebAg1w_IuusNMMZ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function consultarEstado() {
            const ci = document.getElementById('busquedaCi').value.trim();
            const contenedor = document.getElementById('resultadoConsulta');
            
            if (!ci) {
                alert('Por favor ingresa un número de cédula.');
                return;
            }

            contenedor.classList.remove('hidden');
            contenedor.innerHTML = '<p class="text-slate-500">Buscando solicitud...</p>';

            const { data, error } = await supabaseClient
                .from('solicitudes')
                .select('*')
                .eq('ci', ci)
                .single();

            if (error || !data) {
                contenedor.innerHTML = '<p class="text-red-600 font-medium">No se encontró ninguna solicitud registrada con la cédula ingresada.</p>';
                return;
            }

            contenedor.innerHTML = `
                <div class="space-y-1">
                    <p class="text-sm"><strong>Ciudadano:</strong> \${data.nombre}</p>
                    <p class="text-sm"><strong>Barrio:</strong> \${data.barrio}</p>
                    <p class="text-sm"><strong>Ayuda solicitada:</strong> \${data.tipo_ayuda}</p>
                    <div class="mt-2 pt-2 border-t border-slate-200">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Estado Actual:</span>
                        <p class="text-emerald-700 font-bold text-base">\${data.estado}</p>
                    </div>
                </div>
            `;
        }

        async function registrarSolicitud(e) {
            e.preventDefault();
            const ci = document.getElementById('regCi').value.trim();
            const nombre = document.getElementById('regNombre').value.trim();
            const barrio = document.getElementById('regBarrio').value.trim();
            const tipo_ayuda = document.getElementById('regAyuda').value;

            const { error } = await supabaseClient
                .from('solicitudes')
                .insert([{ ci, nombre, barrio, tipo_ayuda, estado: 'Pendiente de Revisión' }]);

            if (error) {
                alert('Error al registrar: ' + error.message);
            } else {
                alert('¡Solicitud registrada con éxito!');
                document.getElementById('formSolicitud').reset();
            }
        }
    </script>
</body>
</html>
